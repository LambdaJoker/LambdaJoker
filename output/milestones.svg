<svg xmlns="http://www.w3.org/2000/svg" width="504" height="128" viewBox="0 0 504 128" role="img" aria-label="stats"><style>
.bg{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.card{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1}
.title{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif;font-size:15px;font-weight:600;fill:#1f2328}
.label{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif;font-size:13px;fill:#57606a}
.value{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif;font-size:13px;font-weight:600;fill:#1f2328}
.muted{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif;font-size:11px;fill:#8c959f}
.repo{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif;font-size:14px;font-weight:600;fill:#0969da}
.desc{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif;font-size:11px;fill:#57606a}
.meta{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif;font-size:11px;fill:#57606a}
@media (prefers-color-scheme:dark){
.bg{fill:#0d1117;stroke:#30363d}
.card{fill:#161b22;stroke:#30363d}
.title{fill:#c9d1d9}.label{fill:#8b949e}.value{fill:#e6edf3}
.muted{fill:#6e7681}.repo{fill:#58a6ff}.desc{fill:#8b949e}.meta{fill:#8b949e}
}
</style><rect class="bg" x="0.5" y="0.5" width="503" height="127" rx="10"/><text class="title" x="24" y="38">Milestones</text><line x1="24" y1="52" x2="480" y2="52" stroke="#d0d7de" stroke-opacity="0.6"/><circle cx="69.0" cy="82" r="26" fill="#7c5cff" fill-opacity="0.15"/><circle cx="69.0" cy="82" r="26" fill="none" stroke="#7c5cff" stroke-width="1.5"/><text class="value" x="69.0" y="86" text-anchor="middle" font-size="14">2 年</text><text x="69.0" y="122" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11" fill="#8b949e">GitHub 年龄</text><circle cx="191.0" cy="82" r="26" fill="#58a6ff" fill-opacity="0.15"/><circle cx="191.0" cy="82" r="26" fill="none" stroke="#58a6ff" stroke-width="1.5"/><text class="value" x="191.0" y="86" text-anchor="middle" font-size="14">6</text><text x="191.0" y="122" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11" fill="#8b949e">仓库</text><circle cx="313.0" cy="82" r="26" fill="#3fb950" fill-opacity="0.15"/><circle cx="313.0" cy="82" r="26" fill="none" stroke="#3fb950" stroke-width="1.5"/><text class="value" x="313.0" y="86" text-anchor="middle" font-size="14">9</text><text x="313.0" y="122" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11" fill="#8b949e">语言</text><circle cx="435.0" cy="82" r="26" fill="#e3b341" fill-opacity="0.15"/><circle cx="435.0" cy="82" r="26" fill="none" stroke="#e3b341" stroke-width="1.5"/><text class="value" x="435.0" y="86" text-anchor="middle" font-size="14">2024</text><text x="435.0" y="122" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11" fill="#8b949e">最早提交</text></svg>
