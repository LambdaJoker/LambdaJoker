name: Update Profile README

on:
  schedule:
    - cron: "0 */12 * * *"      # 每 12 小时跑一次
  workflow_dispatch:             # 允许在 Actions 页面手动点击触发
  push:
    branches: [main]

jobs:
  update-snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      # 1. 生成贡献贪吃蛇（浅色 + 深色两套）
      - name: 生成贪吃蛇 SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: LambdaJoker
          outputs: |
            output/github-snake.svg?palette=github-light
            output/github-snake-dark.svg?palette=github-dark

      # 2. 本地生成统计图表（不依赖 vercel.app，国内也能加载）
      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 生成统计 SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_stats.py

      # 3. 提交回仓库（没有变化就跳过）
      - name: 提交并推送
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then
            echo "内容无变化，跳过提交"
          else
            git commit -m "chore: refresh profile stats & snake [skip ci]"
            git push
          fi

      # ---- 下面是可选的增强模块，取消注释即可启用 ----

      # 3. 自动拉取博客最新文章（需要有 RSS / Atom 源）
